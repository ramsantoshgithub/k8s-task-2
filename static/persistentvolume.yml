apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-static-pv
  labels:
    app: postgres
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  local:
    path: /mnt/data/postgres-static
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
           - key: kubernetes.io/hostname
             operator: In
             values:
               - kind-santosh-worker
